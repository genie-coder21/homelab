# Drop-in: /etc/systemd/system/wg-quick@wg0.service.d/override.conf
[Unit]
# The endpoint is a bare address, so no DNS dependency, but the interface still needs
# the network up before it can bind.
After=network-online.target
Wants=network-online.target

[Service]
# wg-quick is Type=oneshot, which normally means "fail once at boot and stay dead".
# Retry instead. (Restart=on-failure IS permitted for oneshot; always/on-success are not.)
Restart=on-failure
RestartSec=30
