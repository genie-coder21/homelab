# Do not start Docker until the data disk is actually mounted.
#
# Without this, Docker can win the boot race against the data-disk mount, and every
# container that bind-mounts it gets the EMPTY underlying directory instead of the disk.
#
# RequiresMountsFor= adds both Requires= and After= on the matching .mount unit.
#
# Trade-off, accepted deliberately: if the disk is genuinely dead, Docker refuses to start
# rather than bringing containers up blind. A hard stop is noticed; silent blindness is not.
[Unit]
RequiresMountsFor=/mnt/data
