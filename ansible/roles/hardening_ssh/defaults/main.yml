# hardening_ssh - knobs. The drop-in is rendered from these; keep it identical to what is live and prove
# that with --check --diff (changed=0) before the role is ever applied.

# Mode of the main /etc/ssh/sshd_config: sshd reads it as root; nothing else needs it. It is generated by
# ucf, not shipped by dpkg, so dpkg-statoverride does not apply; a re-run of the role restores the mode.
hardening_ssh_main_config_mode: "0600"

# Key-only logins, no root, few tries, short grace time.
hardening_ssh_settings:
  PermitRootLogin: "no"
  MaxAuthTries: 4
  LoginGraceTime: 30
  PasswordAuthentication: "no"
  KbdInteractiveAuthentication: "no"
  AllowAgentForwarding: "no"
  LogLevel: VERBOSE          # logs the key fingerprint of every login

# Only Ed25519 and RSA host keys are offered (the ECDSA key is removed below).
hardening_ssh_host_keys:
  - /etc/ssh/ssh_host_ed25519_key
  - /etc/ssh/ssh_host_rsa_key

# Algorithm set from the ssh-audit hardening guide.
hardening_ssh_kex: sntrup761x25519-sha512@openssh.com,curve25519-sha256,curve25519-sha256@libssh.org,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512
hardening_ssh_ciphers: chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr
hardening_ssh_macs: hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,umac-128-etm@openssh.com
hardening_ssh_host_key_algorithms: ssh-ed25519,ssh-ed25519-cert-v01@openssh.com,rsa-sha2-512,rsa-sha2-512-cert-v01@openssh.com,rsa-sha2-256,rsa-sha2-256-cert-v01@openssh.com

# Extra per-host lines (e.g. client keep-alives on the vps), as a dict in host_vars.
hardening_ssh_extra: {}
