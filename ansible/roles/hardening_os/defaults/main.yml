# hardening_os - knobs.
hardening_os_is_server: "{{ 'linux' in group_names }}"
hardening_os_is_vps: "{{ 'cloud' in group_names }}"
hardening_os_dropin_mode: "0644"

# Kernel hardening sysctl (90-hardening.conf). kernel.sysrq lives in hardening_base's own file.
hardening_os_sysctl:
  fs.suid_dumpable: 0
  kernel.core_uses_pid: 1
  kernel.kptr_restrict: 2
  net.core.bpf_jit_harden: 2
  net.ipv4.conf.default.accept_source_route: 0
  net.ipv4.conf.all.log_martians: 1
  net.ipv4.conf.default.log_martians: 1
# Settings that must sort after /usr/lib/sysctl.d/99-protect-links.conf (which sets protected_fifos=1).
hardening_os_sysctl_late:
  fs.protected_fifos: 2

# Rare network protocols nobody here uses.
hardening_os_blacklist: [dccp, sctp, rds, tipc]

# Login banner (/etc/issue, /etc/issue.net). No sshd Banner: it adds noise to scripted SSH.
hardening_os_banner: |
  Authorized access only. All activity on this system may be monitored and logged.
  Disconnect now if you are not an authorized user.

# login.defs hash rounds. UMASK belongs to hardening_base.
hardening_os_sha_rounds:
  SHA_CRYPT_MIN_ROUNDS: "10000"
  SHA_CRYPT_MAX_ROUNDS: "65536"

# cron modes, persisted with dpkg-statoverride.
hardening_os_vps_cron_overrides:
  - { path: /etc/crontab,      owner: root, group: root, mode: "600" }
  - { path: /etc/cron.d,       owner: root, group: root, mode: "700" }
  - { path: /etc/cron.daily,   owner: root, group: root, mode: "700" }
  - { path: /etc/cron.hourly,  owner: root, group: root, mode: "700" }
  - { path: /etc/cron.weekly,  owner: root, group: root, mode: "700" }
  - { path: /etc/cron.monthly, owner: root, group: root, mode: "700" }
