# /etc/systemd/system/docker.service.d/10-wait-for-data-disk.conf
# Docker must not start before the data disk is mounted, or every container that
# bind-mounts it sees the empty directory underneath. RequiresMountsFor adds both
# Requires= and After= on the mount unit. If the disk is dead, Docker refuses to
# start - the safer failure, and one that gets noticed.
[Unit]
RequiresMountsFor=<DATA_MOUNT>
