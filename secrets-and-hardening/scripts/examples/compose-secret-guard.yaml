# Reference the rendered variable with a :? guard, so a plain `docker compose up`
# (without hl-compose) fails loudly instead of starting with an empty password.
# Keep the guard message free of ": " - a colon-space makes YAML parse the entry as a map.
# Quote the whole entry.
services:
  app:
    image: example/app:latest
    restart: unless-stopped
    user: "1000:1000"
    environment:
      - "APP__AUTH__PASSWORD=${APP_ADMIN_PASSWORD:?start this stack with hl-compose}"
    volumes:
      - ./config:/config
    networks: [apps]
networks:
  apps:
    external: true
